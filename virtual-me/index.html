<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1a1410" />
  <title>Mikołaj Sojka — Software Engineer</title>
  <link rel="icon" href="me.jpg" type="image/jpg" />
  <link rel="stylesheet" href="style.min.css" />
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="scene" width="256" height="144"></canvas>
      <div id="bubble" role="status" aria-live="polite">
        <p id="bubble-text"></p>
      </div>
      <form id="chat">
        <textarea
          id="chat-input"
          name="question"
          maxlength="500"
          autocomplete="off"
          placeholder="Ask me something..."
          aria-label="Ask Mikołaj a question"
        ></textarea>
        <button id="send-btn" type="submit">Send</button>
      </form>
    </div>
  </div>
  <script type="module" src="app.min.js"></script>
</body>
</html>
